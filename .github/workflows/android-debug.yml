name: Android standalone APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/android-debug.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package.json
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        run: npm install
      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive
      - name: Build standalone APK
        shell: bash
        env:
          NODE_ENV: production
        run: |
          set -o pipefail
          ./android/gradlew -p android assembleRelease --stacktrace 2>&1 | tee gradle-build.log
      - name: Publish failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: LibreVoie-build-diagnostics
          path: mobile/gradle-build.log
          if-no-files-found: ignore
      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: LibreVoie-standalone
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
