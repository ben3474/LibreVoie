name: Android debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/android-debug.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package.json
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        run: npm install
      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive
      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          ./android/gradlew -p android assembleDebug --stacktrace 2>&1 | tee gradle-build.log
      - name: Save failure diagnostics
        if: failure()
        run: |
          tail -n 300 gradle-build.log > ../BUILD_FAILURE.log
          cd ..
          git config user.name "LibreVoie CI"
          git config user.email "actions@users.noreply.github.com"
          git add BUILD_FAILURE.log
          git commit -m "Enregistrer le diagnostic du build Android" || true
          git push
      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: LibreVoie-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
